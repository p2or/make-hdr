name: Build MakeHDR

on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: MakeHDR
  LOCAL_PLUGIN_PATH: "${{ github.workspace }}/install"

jobs:

  linux:
    name: '${{ matrix.os }} ${{ matrix.arch-type }}'
    runs-on: ${{ matrix.os }}
    strategy:
      #fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04" # ubuntu-latest
            arch: x86_64
            arch-type: Intel
            build-type: "Release"
    steps:
      # Build with GCC 9 to ensure plugin compatibility with Nuke 14-16+‚
      - name: Install GCC 9
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9

      - name: Set GCC 9 as default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
          gcc --version
          g++ --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/read-version
        id: version

      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build \
            -DOFX_PLUGIN_PATH=${{ env.LOCAL_PLUGIN_PATH }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_C_COMPILER=gcc-9 \
            -DCMAKE_CXX_COMPILER=g++-9

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Upload MakeHDR bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.LOCAL_PLUGIN_PATH }}
          retention-days: 14

  macos:
    name: '${{ matrix.os }} ${{ matrix.arch-type }}'
    runs-on: ${{ matrix.os }}
    strategy:
      #fail-fast: false
      matrix:
        include:
          - os: "macos-14"
            arch: arm64
            arch-type: Apple Silicon
            build-type: "Release"
          - os: "macos-14"
            arch: x86_64
            arch-type: Intel
            build-type: "Release"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/read-version
        id: version

      - name: Configure for Intel
        if: matrix.arch == 'x86_64'
        run: |
          cmake --version
          cmake -S . -B build \
            -DOFX_PLUGIN_PATH=${{ env.LOCAL_PLUGIN_PATH }} \
            -DUSE_ACCELERATE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Configure for ARM
        if: matrix.arch == 'arm64'
        run: |
          cmake --version
          cmake -S . -B build \
            -DOFX_PLUGIN_PATH=${{ env.LOCAL_PLUGIN_PATH }} \
            -DUSE_ACCELERATE=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build
  
      - name: Fix Permissions
        run: |
          xattr -cr ${{ env.LOCAL_PLUGIN_PATH }}/${{ env.PLUGIN_NAME }}.ofx.bundle

      - name: Upload MakeHDR bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.LOCAL_PLUGIN_PATH }}
          retention-days: 14

  windows:
    name: '${{ matrix.os }} ${{ matrix.arch-type }}'
    strategy:
      #fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: Intel
            arch: "x86_64"
            build-type: "Release"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/read-version
        id: version

      - name: Configure (VS2022)
        run: |
          cmake --version
          cmake -S . -B build `
            -DOFX_PLUGIN_PATH=${{ env.LOCAL_PLUGIN_PATH }} `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build-type }}
        
      - name: Install
        run: cmake --install build --config ${{ matrix.build-type }}

      - name: Upload MakeHDR bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.LOCAL_PLUGIN_PATH }}
          retention-days: 14
